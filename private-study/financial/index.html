<title>財務分析｜私人題庫</title><style>
:root{--bg:#f4f6f8;--paper:#fff;--ink:#192735;--muted:#647484;--line:#e1e7ed;--accent:#14675f;--bad:#b72c39}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(460px,100%);background:#fff;border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:0 16px 50px #12273b12}
.icon{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;background:var(--ink);color:#fff;font-size:24px;font-weight:800;margin-bottom:18px}h1{font-size:26px;margin:0 0 8px}p{color:var(--muted);line-height:1.7;margin:0 0 22px;font-size:14px}label{display:block;font-size:12px;font-weight:700;margin-bottom:7px}
input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:11px;font-size:16px;outline:none}input:focus{border-color:#78aaa4;box-shadow:0 0 0 3px #14675f18}
button{width:100%;margin-top:12px;padding:13px 16px;border:0;border-radius:11px;background:var(--accent);color:#fff;font-size:15px;font-weight:700;cursor:pointer}.err{min-height:22px;color:var(--bad);font-size:12px;margin-top:10px}.foot{font-size:11px;color:#82909b;margin-top:18px;line-height:1.7}
</style></head><body><div class="wrap"><main class="card"><div class="icon">財</div><h1>財務分析私人題庫</h1><p>此題庫內容已加密。請輸入密碼後，在這台裝置上解密開啟；密碼不會傳送到伺服器。</p>
